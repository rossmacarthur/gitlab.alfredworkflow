[package]
name = "gitlab-alfred-workflow"
version = "0.3.2"
authors = ["Ross MacArthur <ross@macarthur.io>"]
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
anyhow = "1.0.65"
constcat = "0.6.0"
